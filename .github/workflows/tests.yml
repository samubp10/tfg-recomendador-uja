name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC: revalidación contra la web real

jobs:
  test:
    name: Tests + validación del dataset versionado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ejecutar tests (incluye integridad del dataset)
        run: pytest

  dataset-fresh:
    name: Revalidación semanal contra la web real
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerar el dataset desde la web real
        run: scrapy runspider src/tfg_uja/grados_spider.py -O data/grados.json

      - name: Validar el dataset recién generado
        run: pytest -m dataset
