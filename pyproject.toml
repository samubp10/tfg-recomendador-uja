# ==============================================================================
# SISTEMA DE CONSTRUCCIÓN (Build System - PEP 517)
# Define qué herramientas se utilizan para empaquetar y construir el proyecto.
# ==============================================================================
[build-system]
# Dependencias necesarias para construir el paquete desde el código fuente
requires = ["setuptools>=61.0", "wheel"]
# Motor que ejecutará la construcción (en este caso, setuptools)
build-backend = "setuptools.build_meta"

# ==============================================================================
# METADATOS DEL PROYECTO (Project Metadata - PEP 621)
# Información estándar de configuración e identidad del proyecto.
# ==============================================================================
[project]
name = "tfg-recomendador-uja"
version = "0.1.0"
description = "Recomendador de titulaciones de la Universidad de Jaén basado en RAG"
readme = "README.md"
# El proyecto se desarrolla, prueba y ejecuta con una sola versión menor.
# El límite superior evita prometer compatibilidad con una 3.14 no verificada.
requires-python = ">=3.13,<3.14"
authors = [
    {name = "Samuel Blanco Palmero"}
]
# Dependencias principales de producción (se instalan por defecto con pip install)
# - scrapy: rastreo de la web de la EPSJ.
# - pypdf: extracción del texto de las guías docentes que la EPSJ sirve como
#   PDF desde el curso 2026-27 (IT-67). Es Python puro y ligero, así que el CI
#   puede usarlo directamente en los tests, sin binarios externos como poppler.
# - parsel: los selectores del rastreador. Llega de todas formas con Scrapy,
#   pero el spider lo importa DIRECTAMENTE, y lo que se importa se declara: si
#   no, una versión de Scrapy que dejara de arrastrarlo rompería el rastreo sin
#   que nada avisara. Se importa de aquí y no de `scrapy.selector` porque la
#   clase que reexporta Scrapy no admite parámetro genérico y la comprobación
#   de tipos deja de funcionar (once errores medidos).
dependencies = ["scrapy>=2.13", "pypdf>=4.0", "parsel>=1.9"]

# ==============================================================================
# DEPENDENCIAS OPCIONALES (Optional Dependencies)
# Grupos adicionales de librerías, por ejemplo para desarrollo, entorno CI o docs.
# Se instalan usando corchetes: pip install -e ".[dev]"
# ==============================================================================
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",   # Framework de ejecución de pruebas
    "pytest-cov>=5.0", # Cobertura. Estaba instalado y sin declarar, de modo que
                       #   un entorno recién creado no podía medirla
    "black>=23.0.0",   # Formateador automático de código
    "flake8>=6.0.0",   # Linter para análisis estático (control de estilo PEP 8)
    "mypy>=1.8",       # Verificador estático de tipos
    "lancedb>=0.37",   # Base vectorial (ADR-0004): los tests del indexador la usan en disco
    "pyarrow>=17.0",   # Esquema de la tabla. Se declara porque el indexador lo importa
    "numpy>=1.24",     # Similitud coseno del ranking en evaluacion.py (IT-28)
    "psutil>=7.0",     # RSS del proceso: lo usa la medida de U5 del experimento
                       #   de bases vectoriales, que desde IT-113 esta cubierta
                       #   por pruebas. Estaba solo en `comparativa-vectordb`,
                       #   que el CI no instala, asi que la tanda fallaba alli
                       #   y pasaba en local
]
# Ejecución real del pipeline de indexación (IT-30). Separado de dev porque
# sentence-transformers arrastra PyTorch (cientos de MB) y el CI no lo
# necesita: los tests inyectan un incrustador falso.
index = [
    "lancedb>=0.37",
    "pyarrow>=17.0",
    "sentence-transformers>=3.0",
    "numpy>=1.24",     # Similitud coseno del ranking en evaluacion.py (IT-28)
]
# Comparativa de bases de datos vectoriales (IT-31, ADR-0004). Las versiones van
# FIJADAS con == y no con >=, a diferencia del resto de grupos: el experimento
# compara el comportamiento por defecto de tres bases, y esos valores por defecto
# cambian entre versiones. Sin fijarlas, repetir la comparativa dentro de unos
# meses daría otras cifras sin que nada lo advirtiera, y la comparación dejaría
# de ser reproducible.
#
# El servidor de Qdrant no es una dependencia de Python: va en contenedor, con
# la imagen fijada a la MISMA versión que su cliente.
#
#     docker run -d --name qdrant-tfg -p 6333:6333 -p 6334:6334 \
#         qdrant/qdrant:v1.19.0
#
# Solo hace falta en desarrollo, para ejecutar el experimento; el sistema no
# depende de Docker en marcha.
comparativa-vectordb = [
    "chromadb==1.5.9",
    "lancedb==0.37.1",
    "qdrant-client==1.19.0",
    "numpy==2.5.1",              # línea base de búsqueda exacta por fuerza bruta
    "sentence-transformers==5.6.0",  # para incrustar las 50 preguntas de evaluación
    "psutil==7.2.2",             # RSS del proceso, para U5 (memoria residente)
]

# ==============================================================================
# ENLACES DEL PROYECTO (URLs)
# Metadatos de enlaces que aparecerán si el paquete se publica (ej. en PyPI).
# ==============================================================================
[project.urls]
Repository = "https://github.com/samubp10/tfg-recomendador-uja"

# ==============================================================================
# CONFIGURACIÓN DE HERRAMIENTAS (Tool Configurations)
# Configuraciones específicas para las distintas dependencias del proyecto.
# ==============================================================================

# --- Setuptools (Empaquetado y descubrimiento de código) ---
[tool.setuptools.packages.find]
# Indica que nuestro código fuente está bajo la carpeta src/ (patrón 'src-layout').
# Es el estándar moderno en Python porque evita errores de importación ocultos.
where = ["src"]

# --- Black (Formateador de código) ---
[tool.black]
# Longitud máxima de línea (88 es el valor estándar que usa Black por defecto)
line-length = 88

# Sin esto Black supone la versión más nueva que conoce y **se salta la
# comprobación de AST**: avisa de que no puede verificar la equivalencia y
# devuelve 0 igualmente, o sea que da por bueno un formateo que no ha
# comprobado. Fijándolo a la versión que declara el proyecto, comprueba.
target-version = ["py313"]

# Mypy analiza con la misma versión menor que ejecutan el entorno y el CI.
[tool.mypy]
python_version = "3.13"

# --- Pytest (Framework de pruebas) ---
[tool.pytest.ini_options]
# Directorio donde pytest buscará los archivos de pruebas automáticamente
testpaths = ["tests"]
# Patrón de nombres de archivos que se ejecutarán (archivos que empiezan por test_)
python_files = "test_*.py"
# --strict-markers exige que cualquier @pytest.mark esté registrado abajo.
# -ra imprime el motivo de cada test saltado: un salto silencioso pasa por
# verde, y aquí hay pruebas que se saltan solas cuando falta el índice o el
# servidor de inferencia. Que se anuncie es parte de lo que prometen.
# -m "not lento" deja fuera de la ejecución por defecto las que llaman al
# modelo para todo el conjunto de evaluación; se piden con -m lento.
addopts = "--strict-markers -ra -m 'not lento'"
# Registro de marcadores personalizados para clasificar/filtrar la ejecución de tests
markers = [
    "dataset: valida el dataset local (data/grados.json), que NO se versiona; se ejecuta antes de cada push, no en CI",
    "lento: recorre el conjunto entero llamando al modelo; minutos, no segundos",
]

# --- Coverage (Medida de cobertura de las pruebas) ---
# Se exige el 100 % a TODO lo que enumera `source`, que es `src/tfg_uja/` y
# `scripts/` entero, guiones de experimento incluidos. El CI lo aplica con
# `pytest --cov --cov-fail-under=100`, sin excepciones por carpeta.
#
# El comentario que había aquí decía lo contrario ---que los guiones de
# experimento de un solo uso no se exigían--- y describía una política que la
# configuración nunca ha implementado. Se corrige la explicación y no el
# umbral: la cobertura real es la que dice `source`, y un comentario que no
# coincide con lo que hace la herramienta es de la misma familia que un
# verificador que mide otra cosa de la que cree medir.
# La cobertura que se mide es de SENTENCIA, no de rama. La de rama exigiría
# recorrer cada condición por sus dos salidas y es una promesa distinta y mucho
# más cara; decir «100 %» sin aclarar cuál de las dos es lo que hace que el
# número no signifique nada.
[tool.coverage.run]
branch = false
source = ["src/tfg_uja", "scripts"]

[tool.coverage.report]
show_missing = true
# Líneas que no se pueden ejecutar desde una prueba y cuya ausencia no dice
# nada sobre si el código está probado. Se excluyen por nombre, no con
# `# pragma: no cover` repartido por los ficheros, para que la lista de lo que
# se deja fuera esté en un solo sitio y se pueda auditar de un vistazo.
exclude_also = [
    # Arranque por línea de órdenes: bajo pytest el módulo se importa, nunca
    # se ejecuta como programa.
    "if __name__ == .__main__.:",
    # Reconfiguración de la consola de Windows, que fuerza cp1252. Solo entra
    # cuando la salida NO es UTF-8, y pytest la captura siempre en UTF-8.
    "sys.stdout.reconfigure",
    # Ramas de solo-tipado: no existen en tiempo de ejecución.
    "if TYPE_CHECKING:",
    # Métodos abstractos y protocolos sin cuerpo.
    "raise NotImplementedError",
    '\.\.\.$',
]
